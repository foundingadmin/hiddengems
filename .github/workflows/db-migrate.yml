name: Database migrations

# Rapid build mode (AGENTS.md, "Database"): every push to staging applies the setup script to the staging
# Supabase project, and every push to main applies it to production. The script is idempotent: each
# migration runs once, reference data is upserted, grants are reapplied. Skips until the secret is set.
on:
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      target:
        description: Which database
        type: choice
        options: [staging, production]
        required: true

concurrency:
  group: db-migrate-${{ inputs.target || github.ref_name }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET: ${{ inputs.target || (github.ref_name == 'main' && 'production' || 'staging') }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_STAGING_REF: ${{ vars.SUPABASE_STAGING_REF }}
      SUPABASE_PRODUCTION_REF: ${{ vars.SUPABASE_PRODUCTION_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Destructive statements still fail here before anything reaches a database.
      - run: pnpm db:guard
      - name: Apply to ${{ env.TARGET }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set, so nothing was applied."
            exit 0
          fi
          if [ "$TARGET" = production ] && [ "$GITHUB_REF_NAME" != main ]; then
            echo "::error::Production only takes migrations from main."
            exit 1
          fi
          pnpm db:supabase-apply "$TARGET"
