name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generated Facet files must match their sources.
      - run: node packages/facet/scripts/build.mjs && git diff --exit-code -- packages/facet
      - run: pnpm typecheck
      # Tests run against an in-memory Postgres (PGlite) with the sample provider: no secrets needed.
      - run: pnpm test
      - run: pnpm lint:color
      - run: pnpm --filter web build
