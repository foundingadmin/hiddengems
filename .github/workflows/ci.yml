name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the writing check can diff a pull request against its base.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generated Facet files must match their sources.
      - run: node packages/facet/scripts/build.mjs && git diff --exit-code -- packages/facet
      - run: pnpm typecheck
      # Tests run against an in-memory Postgres (PGlite) with the sample provider: no secrets needed.
      - run: pnpm test
      - run: pnpm lint:color
      - run: pnpm db:guard
      # House writing rules on the lines a pull request adds (ops/sprint/lint-words.mjs).
      - if: github.event_name == 'pull_request'
        run: node ops/sprint/lint-words.mjs origin/${{ github.base_ref }}
      - run: pnpm --filter web build
