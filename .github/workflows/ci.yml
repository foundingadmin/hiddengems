name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the writing check can diff a pull request against its base.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generated Facet files must match their sources.
      - run: node packages/facet/scripts/build.mjs && git diff --exit-code -- packages/facet
      # The Facet kit (kit/) is committed with its neutral brand: generated files must match, and its rules must hold.
      - run: node kit/scripts/build.mjs && git diff --exit-code -- kit && node --test kit/scripts/*.test.mjs
      - run: pnpm typecheck
      # Tests run against an in-memory Postgres (PGlite) with the sample provider: no secrets needed.
      - run: pnpm test
      - run: pnpm lint:color
      - run: pnpm db:guard
      # House writing rules on the lines a pull request adds (ops/sprint/lint-words.mjs).
      - if: github.event_name == 'pull_request'
        run: node ops/sprint/lint-words.mjs origin/${{ github.base_ref }}
      - run: pnpm --filter web build
      # The kit as one zip, for starting another project (kit/START-HERE.md).
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node kit/scripts/pack.mjs
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: facet-kit
          path: kit/dist/*.zip
