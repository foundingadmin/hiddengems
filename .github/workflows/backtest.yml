name: Backtest

# Runs the Weeks 1 to 8 replay and Saturday capsules (ops/backtest) where The Odds API and the Wayback Machine are
# reachable. It fires only when
# experiments/backtest/run.json changes on a data/backtest-* branch, so a push spends credits only when asked.
# Raw odds stay in the Actions cache, readable by this repo's workflows only, so nothing paid is bought twice or
# published. The ledger, results and README are committed back to the branch.
on:
  push:
    branches: ['data/backtest-*']
    paths: ['experiments/backtest/run.json']

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore bought odds
        uses: actions/cache/restore@v4
        with:
          path: |
            experiments/backtest/cache/odds
            experiments/backtest/cache/wayback
          key: backtest-odds-${{ github.run_id }}
          restore-keys: backtest-odds-
      - name: nflverse 2026
        run: |
          d=experiments/backtest/cache/nflverse; mkdir -p $d
          b=https://github.com/nflverse/nflverse-data/releases/download
          for u in schedules/games.csv rosters/roster_2026.csv weekly_rosters/roster_weekly_2026.csv stats_player/stats_player_week_2026.csv pbp/play_by_play_2026.csv.gz snap_counts/snap_counts_2026.csv injuries/injuries_2026.csv depth_charts/depth_charts_2026.csv; do
            curl -sSfL -o "$d/$(basename $u)" "$b/$u"
          done
      - name: Read the run request
        id: run
        run: echo "mode=$(node -p "require('./experiments/backtest/run.json').mode")" >> "$GITHUB_OUTPUT"
      - name: Test the key
        if: steps.run.outputs.mode == 'test' || steps.run.outputs.mode == 'probe'
        env:
          ODDS_API_KEY_HISTORICAL: ${{ secrets.ODDS_API_KEY_HISTORICAL }}
        run: |
          node ops/backtest/fetch-odds.mjs --${{ steps.run.outputs.mode }}
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add experiments/backtest/key-test.json
          git commit -m "Record the Odds API key test" && git push || echo "Nothing new to commit"
      - name: Buy what the cache lacks
        if: steps.run.outputs.mode == 'full'
        env:
          ODDS_API_KEY_HISTORICAL: ${{ secrets.ODDS_API_KEY_HISTORICAL }}
        run: |
          max=$(node -p "require('./experiments/backtest/run.json').maxCredits")
          node ops/backtest/fetch-odds.mjs --max-credits "$max"
      - if: steps.run.outputs.mode == 'full'
        run: packages/ingest/node_modules/.bin/tsx ops/backtest/replay.ts
      - name: Saturday capsules
        if: steps.run.outputs.mode == 'full'
        run: packages/ingest/node_modules/.bin/tsx ops/backtest/capsules.ts
      - name: Keep bought odds and captures
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            experiments/backtest/cache/odds
            experiments/backtest/cache/wayback
          key: backtest-odds-${{ github.run_id }}
      - name: Commit the ledger
        if: steps.run.outputs.mode == 'full'
        run: |
          cp experiments/backtest/cache/odds/spend.json experiments/backtest/spend.json
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add experiments/ledger experiments/backtest/capsules experiments/backtest/README.md experiments/backtest/results.json experiments/backtest/spend.json
          git commit -m "Record the Weeks 1 to 8 backtest" && git push || echo "Nothing new to commit"
